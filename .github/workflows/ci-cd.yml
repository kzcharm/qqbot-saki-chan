name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/qqbot-saki-chan

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test*.py' -v

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:sha-${{ github.sha }}
            ${{ env.IMAGE_REPO }}:latest

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: qqbot-saki-chan-production
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare deployment environment
        env:
          QQBOT_PROD_ENV: ${{ secrets.QQBOT_PROD_ENV }}
          QQ_BOT_SECRET: ${{ secrets.QQ_BOT_SECRET }}
        run: |
          test -n "$QQBOT_PROD_ENV"
          test -n "$QQ_BOT_SECRET"
          printf '%s\n' "$QQBOT_PROD_ENV" > .env.deploy
          {
            printf 'QQ_BOT_SECRET=%s\n' "$QQ_BOT_SECRET"
            printf 'IMAGE_REPO=%s\n' "$IMAGE_REPO"
            printf 'IMAGE_TAG=sha-%s\n' "$GITHUB_SHA"
            printf 'QQBOT_DATA_DIR=/opt/qqbot-saki-chan/data\n'
          } >> .env.deploy
          mkdir -p /opt/qqbot-saki-chan/data
      - name: Deploy only this Compose project
        run: |
          docker compose -p qqbot-saki-chan -f compose.prod.yml --env-file .env.deploy pull
          docker compose -p qqbot-saki-chan -f compose.prod.yml --env-file .env.deploy up -d --no-deps qqbot
          docker compose -p qqbot-saki-chan -f compose.prod.yml --env-file .env.deploy ps --status running qqbot
